[project]
name = "fizzbuzz-tdd-kata"
version = "0.1.0"
description = "A TDD kata: Fizzbuzz, from notebook exploration to a tested, pubilsh package"
readme = "README.md"
requires-python = ">=3.14"


dependencies = []

[project.scripts]
fizzbuzz-tdd-kata = "fizzbuzz_tdd_kata:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "marimo>=0.24.2",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]


