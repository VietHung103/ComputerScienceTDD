[project]
name = "fizzbuzz-tdd-kata"
version = "0.1.0"
description = "A TDD kata: Fizzbuzz, from notebook exploration to a tested, pubilsh package"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Viet Hung", email = "viethungpc103@gmail.com"}]


dependencies = []

[project.scripts]
fizzbuzz-tdd-kata = "fizzbuzz_tdd_kata:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.target.wheel]
packages = ["src/fizzbuzz_tdd_kata"]

[dependency-groups]
dev = [
    "marimo>=0.24.2",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
    "pytest-cov>=5.0", 
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

